<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="<%= webpackConfig.output.publicPath %>favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= webpackConfig.output.publicPath %>favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="<%= webpackConfig.output.publicPath %>favicon.png" />
    <link rel="apple-touch-icon" href="<%= webpackConfig.output.publicPath %>apple-touch-icon.png" />
    <link rel="manifest" href="<%= webpackConfig.output.publicPath %>site.webmanifest" />
    <script>
      // apply the saved theme before the app loads (default: light)
      (function () {
        try {
          var t = localStorage.getItem("karrar.theme");
          if (t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
          if (localStorage.getItem("karrar.lang") === "ar") {
            document.documentElement.setAttribute("lang", "ar");
            document.documentElement.setAttribute("dir", "rtl");
          }
        } catch (e) {}
      })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Karrar Delivery</title>
    <meta name="description" content="Karrar Delivery operations dashboard" />
    <meta name="apple-mobile-web-app-title" content="Karrar" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />

    <!--  Fonts and icons     -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,400italic"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!-- while the app loads: the sign-in screen's outline instead of a blank page
         (replaced by the app as soon as it starts) -->
    <style>
      .k-boot { position: fixed; inset: 0; display: none; place-items: center; background: linear-gradient(160deg, #0b1336 0%, #0a1130 45%, #080e28 100%); }
      .k-boot.on { display: grid; }
      .k-boot-card { width: min(440px, calc(100vw - 32px)); height: 470px; border-radius: 22px; background: #fff; box-shadow: 0 50px 110px -40px rgba(0, 0, 0, 0.85); padding: 38px; box-sizing: border-box; }
      html[data-theme="dark"] .k-boot-card { background: #0f1840; }
      .k-boot-bar { height: 12px; border-radius: 6px; margin-bottom: 14px; background: linear-gradient(90deg, rgba(10, 17, 48, 0.07) 25%, rgba(10, 17, 48, 0.13) 50%, rgba(10, 17, 48, 0.07) 75%); background-size: 200% 100%; animation: k-boot 1.2s ease-in-out infinite; }
      html[data-theme="dark"] .k-boot-bar { background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 75%); }
      .k-boot-bar.is-logo { width: 72px; height: 30px; margin-bottom: 26px; }
      .k-boot-bar.is-title { width: 55%; height: 22px; }
      .k-boot-bar.is-sub { width: 75%; margin-bottom: 34px; }
      .k-boot-bar.is-field { height: 46px; border-radius: 8px; margin-bottom: 22px; }
      .k-boot-bar.is-btn { height: 48px; border-radius: 12px; margin-top: 10px; background: rgba(245, 124, 0, 0.35); animation: none; }
      @keyframes k-boot { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      .k-boot-line { position: fixed; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; }
      .k-boot-line i { position: absolute; top: 0; bottom: 0; width: 35%; background: #f57c00; border-radius: 3px; animation: k-boot-line 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      @keyframes k-boot-line { from { left: -35%; } to { left: 100%; } }
      .k-boot-slow { position: fixed; left: 0; right: 0; bottom: 48px; text-align: center; font: 500 13px/1.4 Inter, Roboto, sans-serif; color: rgba(174, 184, 214, 0.85); opacity: 0; animation: k-boot-fade 0.5s ease 4s forwards; }
      @keyframes k-boot-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .k-boot-bar { animation: none; } }
    </style>
    <div id="app">
      <div id="k-boot" class="k-boot" aria-hidden="true">
        <div class="k-boot-line"><i></i></div>
        <p class="k-boot-slow" id="k-boot-slow">Still loading… a slow connection can take a moment.</p>
        <div class="k-boot-card">
          <div class="k-boot-bar is-logo"></div>
          <div class="k-boot-bar is-title"></div>
          <div class="k-boot-bar is-sub"></div>
          <div class="k-boot-bar is-field"></div>
          <div class="k-boot-bar is-field"></div>
          <div class="k-boot-bar is-btn"></div>
        </div>
      </div>
    </div>
    <script>
      // show the outline only when the sign-in page is what will open
      (function () {
        try {
          var signedIn = !!localStorage.getItem("token");
          if (!signedIn || /^#\/login/.test(location.hash)) document.getElementById("k-boot").className += " on";
          if (localStorage.getItem("karrar.lang") === "ar") document.getElementById("k-boot-slow").textContent = "ما زال التحميل جارياً… قد يستغرق الاتصال البطيء بعض الوقت.";
        } catch (e) {}
      })();
    </script>
    <!-- built files will be auto injected -->
  </body>
</html>
